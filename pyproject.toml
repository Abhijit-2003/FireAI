[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fireai-rules-vs-llms"
version = "1.0.0"
description = "Rules vs LLMs Take-Home Assignment — Fire AI"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "google-generativeai>=0.8.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "tabulate>=0.9",
    "tqdm>=4.65",
    "rapidfuzz>=3.0",
    "datasketch>=1.6",
    "scipy>=1.10",
    "requests>=2.31",
]

[tool.pytest.ini_options]
testpaths = ["project_a/tests", "project_b/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["project_a*", "project_b*"]

